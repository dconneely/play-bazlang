[versions]
antlr = "4.13.2"
jline = "4.3.1"
junit = "6.1.3"
spotless = "8.10.0"
spotbugs = "6.5.11"
checkstyle = "13.11.0"
pmd = "7.22.0"
spotbugs-tool = "4.10.4"
findsecbugs = "1.14.0"
jacoco-tool = "0.8.14"

[libraries]
antlr-tool = { group = "org.antlr", name = "antlr4", version.ref = "antlr" }
antlr-runtime = { group = "org.antlr", name = "antlr4-runtime", version.ref = "antlr" }
jline = { group = "org.jline", name = "jline", version.ref = "jline" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
findsecbugs-plugin = { group = "com.h3xstream.findsecbugs", name = "findsecbugs-plugin", version.ref = "findsecbugs" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
