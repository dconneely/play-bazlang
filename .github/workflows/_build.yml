name: _Build

on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # No separate spotlessCheck step - Spotless wires it into `check`, which `build` already runs.
      - name: Build
        run: ./gradlew build

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' # one canonical summary per run, not once per OS
        shell: bash
        continue-on-error: true # never let a formatting hiccup here fail the build
        run: sh scripts/coverage-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build reports
        if: ${{ !cancelled() }} # keep reports from a failed run too, unlike always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports-${{ matrix.os }}
          path: |
            */build/test-results/test/
            */build/reports/tests/test/
            */build/reports/jacoco/test/
            */build/reports/checkstyle/
            */build/reports/pmd/
            */build/reports/spotbugs/
          if-no-files-found: warn
