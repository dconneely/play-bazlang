name: "Link check"

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

jobs:
  lychee:
    name: "lychee"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed manually rather than via lycheeverse/lychee-action, so this step's only job is
      # getting the pinned lychee binary onto PATH - the actual check (exclude/accept rules
      # included) lives in scripts/check-links.sh, the same script you'd run locally, so the two
      # can never drift apart.
      - name: Install lychee
        shell: bash
        env:
          LYCHEE_VERSION: v0.24.2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          arch="$(uname -m)"
          filename="lychee-${arch}-unknown-linux-gnu.tar.gz"
          curl -sfL -o "$tmp/$filename" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/${filename}"
          tar -xzf "$tmp/$filename" -C "$tmp"
          install -D -t "$HOME/.local/bin" "$tmp/lychee-${arch}-unknown-linux-gnu/lychee"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # lychee's own --output writes the report to a file rather than stdout, so a failure's
      # detail was previously visible only in the (browser-only, unfetchable-by-API) job summary.
      # Capture the exit status separately from `set -e` so it survives the `cat`, and print the
      # report into the plain step log too - `gh run view --log` alone is then enough to diagnose
      # a failure, no browser needed.
      - name: Check links
        shell: bash
        run: |
          set +e
          sh scripts/check-links.sh --format markdown --output lychee-report.md
          status=$?
          set -e
          echo "::group::lychee report"
          cat lychee-report.md
          echo "::endgroup::"
          exit "$status"

      - name: Job summary
        if: ${{ always() }}
        run: cat lychee-report.md >> "$GITHUB_STEP_SUMMARY" || true
