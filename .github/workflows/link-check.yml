name: "Link check"

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

jobs:
  lychee:
    name: "lychee"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --method get, not the default HEAD: some hosts error on HEAD but answer GET.
          # theqlforum.com (incl. its qlwiki. subdomain) 403s every automated checker, UA or no UA -
          # it's a real, human-reachable site, just not link-checker-reachable.
          # element.zxfiles.net (NextBASIC manual) is a live, working URL that's just consistently
          # slow/flaky from GitHub's runner network - excluded rather than accepted as a timeout,
          # since lychee's in-run cache re-reports a cached timeout as a generic (non-timeout) error
          # for every doc after the first that cites the same URL, defeating --accept-timeouts.
          args: --no-progress --method get --max-concurrency 4 --exclude 'theqlforum\.com|element\.zxfiles\.net' "docs/research/**/*.md" "docs/adr/**/*.md"
          fail: true
