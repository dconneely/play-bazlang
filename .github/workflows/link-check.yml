name: "Link check"

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

jobs:
  lychee:
    name: "lychee"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --method get, not the default HEAD: some hosts error on HEAD but answer GET.
          # theqlforum.com (incl. its qlwiki. subdomain) 403s every automated checker, UA or no UA -
          # it's a real, human-reachable site, just not link-checker-reachable.
          args: --no-progress --method get --max-concurrency 4 --exclude 'theqlforum\.com' "docs/research/**/*.md" "docs/adr/**/*.md"
          fail: true
