plugins {
    id 'java'
    id 'application'
    id 'com.diffplug.spotless' version '8.1.0'
    id 'antlr'
}

group = 'com.davidconneely'
version = '1.0-SNAPSHOT'

application {
    mainClass = 'com.davidconneely.bazlang.MainClass'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    antlr 'org.antlr:antlr4:4.13.1'
    implementation 'org.antlr:antlr4-runtime:4.13.1'
    implementation 'org.jline:jline:3.29.0'
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.davidconneely.bazlang.MainClass',
            'Class-Path': configurations.runtimeClasspath.files.collect { "lib/$it.name" }.join(' ')
        )
    }
}

tasks.register('copyDependencies', Copy) {
    from configurations.runtimeClasspath
    into "$buildDir/libs/lib"
}

build.dependsOn copyDependencies

// Configure ANTLR
generateGrammarSource {
    maxHeapSize = '64m'
    arguments += ['-visitor']
    packageName = 'com.davidconneely.bazlang.antlr'
}

// Make sure ANTLR generation happens before Java compilation
compileJava.dependsOn generateGrammarSource

// Make sure generated sources are on the classpath
sourceSets {
    main {
        java {
            srcDirs += "${buildDir}/generated-src/antlr/main"
        }
    }
}

spotless {
    java {
        googleJavaFormat()
        targetExclude 'build/generated-src/**'
    }
}