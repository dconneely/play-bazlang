repos:
  - repo: local
    hooks:
      - id: spotless-apply
        name: Spotless (auto-format)
        language: system
        entry: ./gradlew spotlessApply
        pass_filenames: false
        types: [java]

      - id: compile
        name: Compile
        language: system
        entry: ./gradlew compileJava compileTestJava
        pass_filenames: false
        types: [java]

      - id: checkstyle
        name: Checkstyle
        language: system
        entry: ./gradlew checkstyleMain checkstyleTest
        pass_filenames: false
        types: [java]

      - id: pmd
        name: PMD
        language: system
        entry: ./gradlew pmdMain pmdTest
        pass_filenames: false
        types: [java]

      # spotbugsMain/spotbugsTest and test are omitted - too slow for pre-commit; run via CI.

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
